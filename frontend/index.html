<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANI AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- NEURAL NETWORK BACKGROUND (replaces matrix) -->
    <canvas id="neuralCanvas"></canvas>
    <div class="scanlines"></div>

    <div class="app">

        <!-- LOGIN SCREEN -->
        <div id="authScreen" class="auth-screen">
            <div class="auth-box">
                <div class="logo" style="margin: 0 auto 20px;">N</div>
                <h2 id="authTitle">Login to NANI AI</h2>
                <input id="authUsername" type="text" placeholder="Username" autocomplete="off">
                <input id="authPassword" type="password" placeholder="Password" autocomplete="off">
                <button id="authSubmitBtn" class="send-btn" style="width: 100%; margin-top: 10px;">
                    Login
                </button>
                <p id="authError" class="auth-error"></p>
                <p class="auth-toggle">
                    <span id="authToggleText">Don't have an account?</span>
                    <a href="#" id="authToggleLink">Sign up</a>
                </p>
            </div>
        </div>

        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <div class="logo">N</div>
                <div class="brand-text">
                    <h1>NANI<span class="cursor-blink">_</span>AI</h1>
                    <span class="status-line"><span class="status-dot"></span>SYSTEM ONLINE</span>
                </div>
            </div>
            <button id="newChatBtn" class="new-chat-btn">+</button>
        </header>

        <!-- CHAT AREA -->
        <main id="chatArea" class="chat-area">
            <section id="welcomeScreen" class="welcome">
                <div class="welcome-logo">N</div>
                <h2>Welcome to NANI AI</h2>
                <p>Your personal AI assistant</p>

                <div class="quick-actions">
                    <button class="quick-btn">
                        <span class="qb-icon">🛡️</span>
                        <span class="qb-bracket">[</span><span>CYBERSECURITY</span><span class="qb-bracket">]</span>
                    </button>
                    <button class="quick-btn">
                        <span class="qb-icon">💻</span>
                        <span class="qb-bracket">[</span><span>CODING</span><span class="qb-bracket">]</span>
                    </button>
                    <button class="quick-btn">
                        <span class="qb-icon">🚩</span>
                        <span class="qb-bracket">[</span><span>CTF</span><span class="qb-bracket">]</span>
                    </button>
                    <button class="quick-btn">
                        <span class="qb-icon">🧠</span>
                        <span class="qb-bracket">[</span><span>LEARN</span><span class="qb-bracket">]</span>
                    </button>
                </div>
            </section>
        </main>

        <!-- INPUT AREA -->
        <footer class="input-area">
            <div class="input-box">

                <!-- MIC ORB BUTTON -->
                <button id="micBtn" class="orb-btn mic-btn" title="Voice input">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    <span class="orb-ring"></span>
                </button>

                <input id="messageInput" type="text" placeholder="Ask NANI AI..." autocomplete="off">

                <!-- CAMERA ORB BUTTON -->
                <button id="cameraBtn" class="orb-btn cam-btn" title="Camera">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <span class="orb-ring"></span>
                </button>

                <button id="sendBtn" class="send-btn">➤</button>
            </div>
            <div class="footer-text">NANI AI • Your AI • Your Future</div>
        </footer>

    </div>

    <!-- CAMERA PREVIEW MODAL -->
    <div id="camModal" class="cam-modal hidden">
        <video id="camVideo" autoplay playsinline></video>
        <button id="camCloseBtn" class="cam-close">✕</button>
    </div>

    <script src="script.js"></script>

    <!-- NEURAL BACKGROUND + CAMERA LOGIC -->
    <script>
        /* ===== NEURAL CONSTELLATION BACKGROUND ===== */
        (() => {
            const canvas = document.getElementById('neuralCanvas');
            const ctx = canvas.getContext('2d');
            let W, H, nodes = [];
            const mouse = { x: null, y: null };

            function resize() {
                W = canvas.width = innerWidth;
                H = canvas.height = innerHeight;
            }

            function init() {
                nodes = [];
                const count = Math.min(90, Math.floor((W * H) / 16000));
                for (let i = 0; i < count; i++) {
                    nodes.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        r: Math.random() * 1.6 + 0.8,
                        c: Math.random() > 0.5 ? '0,229,255' : '162,75,255'
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                const LINK = 130;

                for (let i = 0; i < nodes.length; i++) {
                    const a = nodes[i];

                    // connect nodes to the mouse cursor
                    if (mouse.x !== null) {
                        const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
                        if (md < 180) {
                            ctx.strokeStyle = `rgba(0,229,255,${(1 - md / 180) * 0.4})`;
                            ctx.lineWidth = 0.7;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }

                    for (let j = i + 1; j < nodes.length; j++) {
                        const b = nodes[j];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < LINK) {
                            ctx.strokeStyle = `rgba(0,229,255,${(1 - d / LINK) * 0.25})`;
                            ctx.lineWidth = 0.6;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                }

                for (const n of nodes) {
                    n.x += n.vx; n.y += n.vy;
                    if (n.x < 0 || n.x > W) n.vx *= -1;
                    if (n.y < 0 || n.y > H) n.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${n.c},0.9)`;
                    ctx.shadowColor = `rgba(${n.c},1)`;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                requestAnimationFrame(draw);
            }

            addEventListener('resize', () => { resize(); init(); });
            addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

            resize(); init(); draw();
        })();

        /* ===== CAMERA BUTTON ===== */
        const cameraBtn = document.getElementById('cameraBtn');
        const camModal  = document.getElementById('camModal');
        const camVideo  = document.getElementById('camVideo');
        const camClose  = document.getElementById('camCloseBtn');
        let camStream = null;

        cameraBtn.addEventListener('click', async () => {
            if (camStream) { closeCam(); return; }
            try {
                camStream = await navigator.mediaDevices.getUserMedia({ video: true });
                camVideo.srcObject = camStream;
                camModal.classList.remove('hidden');
                cameraBtn.classList.add('active');
            } catch (err) {
                console.warn('Camera access denied', err);
            }
        });

        function closeCam() {
            camStream.getTracks().forEach(t => t.stop());
            camStream = null;
            camModal.classList.add('hidden');
            cameraBtn.classList.remove('active');
        }
        camClose.addEventListener('click', closeCam);
    </script>
</body>
</html>
